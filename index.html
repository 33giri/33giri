<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>33Giri Catalogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- cache bust -->
  <link rel="stylesheet" href="/33giri/assets/css/styles.css?v=7" />
</head> 
 
<body class="public">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="26" stroke="#0f4a5e" stroke-width="4"/>
          <circle cx="32" cy="32" r="7" stroke="#0f4a5e" stroke-width="4"/>
        </svg>
        <span>33Giri Catalogo</span>
      </div>

      <button class="icon-btn" id="openAdmin" title="Admin">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="#0f4a5e" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 10h12v10H6V10Z" stroke="#0f4a5e" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="container" style="text-align:center;">
      <h1 id="heroTitle">Arte in Vinile</h1>
      <p id="heroSubtitle">Vinili trasformati in pezzi unici. Ogni pezzo racconta una storia musicale.</p>
    </div>
  </section>

  <section class="filters">
    <div class="container">
      <div class="filters-row">
        <input id="q" class="search" placeholder="Cerca per titolo o artista..." />
        <button class="filter-btn" id="toggleFilters">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M7 12h10M10 18h4" stroke="#0d3b4b" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Filtri
          <span id="chev">^</span>
        </button>
      </div>

      <div class="filters-advanced" id="advanced">
        <div class="selects">
          <select class="select" id="fModel"><option value="">Modello</option></select>
          <select class="select" id="fCollection"><option value="">Collezione</option></select>
          <select class="select" id="fGenre"><option value="">Genere</option></select>
          <select class="select" id="fYear"><option value="">Anno</option></select>
        </div>
      </div>
    </div>
  </section>

  <section class="list">
    <div class="container">
      <div class="count"><span id="count">0</span> prodotti trovati</div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- PRODUCT MODAL -->
  <div class="modal-backdrop" id="productModal">
    <div class="modal">
      <button class="modal-close" id="closeProduct">✕</button>

      <div class="modal-grid">
        <div class="modal-img">
          <button class="img-nav prev" id="imgPrev" type="button" aria-label="Precedente">‹</button>
          <img id="mImg" alt="">
          <button class="img-nav next" id="imgNext" type="button" aria-label="Successiva">›</button>
        </div>

        <div class="modal-content">
          <h2 id="mTitle"></h2>
          <div class="modal-artist" id="mArtist"></div>

          <div class="info-grid">
            <div class="info-box">
              <div>
                <div class="info-label">GENERE</div>
                <div class="info-value" id="mGenre"></div>
              </div>
            </div>
            <div class="info-box">
              <div>
                <div class="info-label">ANNO</div>
                <div class="info-value" id="mYear"></div>
              </div>
            </div>
          </div>

          <div class="status-row">
            <div class="status">
              <span class="dot" id="mDot"></span>
              <span id="mStatusText">Disponibile - Pezzo Unico</span>
            </div>
          </div>

          <button class="whatsapp-btn" id="whBtn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2a9 9 0 0 0-7.8 13.5L3 22l6.7-1.8A9 9 0 1 0 12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
              <path d="M8.6 9.1c.2-.6.5-.6.7-.6h.6c.2 0 .4 0 .6.4.2.4.8 1.9.8 2 0 .2.1.4-.1.6-.2.2-.3.4-.5.6-.2.2-.4.4-.2.7.2.3.9 1.5 2 2.4 1.4 1.2 2.6 1.6 3 .1.4-.2.7-.9.9-1.2.2-.3.4-.2.6-.1.2.1 1.4.7 1.6.8.2.1.4.2.4.4 0 .2 0 1.1-.8 1.7-.8.6-1.5.7-2.1.6-.6-.1-2.1-.7-3.6-2.1-1.7-1.5-2.8-3.4-3-3.9-.2-.5-.6-1.4-.6-2.1 0-.7.2-1.3.4-1.7Z" fill="white"/>
            </svg>
            Contattaci su WhatsApp
          </button>

          <div class="modal-note" id="mExtra"></div>

          <!-- ✅ INFO identica alla home -->
          <button class="mini-info modal-info" id="modalInfo" type="button" aria-label="Info">
            i
            <span class="tip" role="tooltip">Modello standard, personalizzabile su richiesta</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN LOGIN MODAL -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal small">
      <button class="modal-close" id="closeAdmin">✕</button>
      <div class="modal-content" style="padding:24px;">
        <h2 style="font-size:18px;letter-spacing:0;margin:0 0 14px;color:#0e1626;">Accesso Admin</h2>
        <input id="adminCode" class="search" style="height:46px;" placeholder="Inserisci il codice" />
        <button class="primary-btn" id="adminEnter" style="margin-top:14px;width:100%;">Accedi</button>
        <div class="modal-note" id="adminErr" style="color:rgba(14,22,38,.6)"></div>
      </div>
    </div>
  </div>

  <script src="/33giri/assets/js/config.js?v=6"></script>
  <script type="module" src="/33giri/assets/js/store.js?v=12"></script>
  <script type="module" src="/33giri/assets/js/public.js?v=12"></script>
</body>
</html>
